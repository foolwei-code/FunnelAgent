syntax = "proto3";

package reranker;

service RerankerService {
  rpc Rerank (RerankRequest) returns (RerankResponse);
}

message RerankItem {
  string doc_id = 1;
  string text = 2;
}

message RerankRequest {
  string query = 1;
  repeated RerankItem items = 2;
  int32 top_k = 3;
}

message RerankResult {
  string doc_id = 1;
  double score = 2;
  string text = 3;
}

message RerankResponse {
  repeated RerankResult items = 1;
}
